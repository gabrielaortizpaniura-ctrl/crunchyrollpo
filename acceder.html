<!DOCTYPE html>

<html lang="es">



<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceder - Crunchyroll</title>

  <link rel="stylesheet" href="acceder.css">

</head>



<body>



  <header>

    <div class="logo">

      🟠 CRUNCHYROLL

    </div>

  </header>



  <main class="login-container">



    <div class="login-box">



      <h1>Iniciar sesión</h1>



      <label>Correo electrónico</label>

      <input type="email" placeholder="Ingresa tu correo">



      <label>Contraseña</label>

      <input type="password" placeholder="Ingresa tu contraseña">



      <button class="btn-acceder">ACCEDER</button>



      <a href="#" class="olvidaste">¿Olvidaste tu contraseña?</a>



      <div class="separador"></div>



      <p>¿No tienes una cuenta?</p>



      <button class="btn-crear">CREAR CUENTA</button>



    </div>



  </main>



  <footer>

    <span>Términos de Uso</span>

    <span>Política de Privacidad</span>

    <span>Consentimiento de cookies</span>

  </footer>






  

</body>

</html>
